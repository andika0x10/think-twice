name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check format, lint, unit tests, and web build
        run: npm run check
      - name: Install Chrome for browser tests
        run: npx playwright install --with-deps chrome
      - name: Browser tests
        run: npm run test:e2e
      - name: Sync Android
        run: npx cap sync android
      - name: Build debug APK and lint Android
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:lintDebug --no-daemon --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: think-twice-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failure-reports
          path: |
            test-results/
            playwright-report/
            android/app/build/reports/
          retention-days: 7
