name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (example: v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (!/^(0|[1-9]\d{0,2})\.(0|[1-9]\d{0,2})\.(0|[1-9]\d{0,2})$/.test(version) || version === '0.0.0' || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Tag must match package.json version: vMAJOR.MINOR.PATCH (each 0–999, minimum 0.0.1).')
          }
          NODE
      - uses: ./.github/actions/setup
      - name: Check format, lint, unit tests, and web build
        run: npm run check
      - name: Install Chrome for browser tests
        run: npx playwright install --with-deps chrome
      - name: Browser tests
        run: npm run test:e2e
      - name: Sync Android
        run: npx cap sync android
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name. See docs/RELEASING.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/think-twice-release.jks"
      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/think-twice-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew :app:assembleRelease :app:bundleRelease :app:lintRelease --no-daemon --console=plain
      - name: Package and verify release assets
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/think-twice-$RELEASE_TAG.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "artifacts/think-twice-$RELEASE_TAG.aab"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "artifacts/think-twice-$RELEASE_TAG.apk"
          jarsigner -verify "artifacts/think-twice-$RELEASE_TAG.aab"
          cd artifacts
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: think-twice-${{ env.RELEASE_TAG }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* \
            --verify-tag --title "Think Twice $RELEASE_TAG" --generate-notes \
            --notes 'Unduh APK untuk instalasi Android (Android 7.0+). AAB untuk distribusi Play Store; SHA256SUMS.txt untuk verifikasi berkas.'
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/think-twice-release.jks"
