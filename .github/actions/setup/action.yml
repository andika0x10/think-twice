name: Setup build tools
description: Install Node.js dependencies, JDK 21, and Android SDK 36
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
      shell: bash
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
    - uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: false
        packages: ''
    - name: Accept Android SDK licenses
      shell: bash
      run: |
        # sdkmanager may need more answers than setup-android's fixed input supplies.
        # Ignore yes's SIGPIPE when sdkmanager finishes; preserve sdkmanager failures.
        set +o pipefail
        yes | sdkmanager --licenses
        set -o pipefail
    - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      shell: bash
